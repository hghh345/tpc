<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>tiny photo club</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<main>

<!-- HERO -->

<section class="hero">

    <h1>

        hello,<br>
        digital hoarder.

    </h1>

</section>

<!-- FAST SLIDESHOW -->

<section class="section slideshow-section">

    <div class="copy">

        you've been meaning<br>
        to print these.

    </div>

    <div class="slideshow fast">

        <img
        id="fast-slideshow"
        src="image1.jpeg"
        alt="memory">

    </div>

</section>

<!-- CAMERA ROLL AUDIT -->

<section class="section">

    <div
    class="audit"
    id="audit">

    </div>

</section>

<!-- SLOW SLIDESHOW -->

<section class="section slideshow-section">

    <h2>

        remember them?

    </h2>

    <div class="slideshow slow">

        <img
        id="slow-slideshow"
        src="image8.jpeg"
        alt="memory">

    </div>

</section>

<!-- BIG STATEMENT -->

<section class="section">

    <h2>

        your camera roll
        is becoming
        a museum.

    </h2>

</section>

<!-- ABOUT -->

<section class="section about">

    <h2>

        tiny photo club

    </h2>

    <p>

        we rescue photos from the bottom
        of your camera roll.

        <br><br>

        every month we mail you twelve tiny prints.

        <br><br>

        that's it.

    </p>

    <a
    href="upload.html"
    class="cta">

        pick your dozen →

    </a>

</section>

</main>

<script src="app.js"></script>

</body>
</html>
