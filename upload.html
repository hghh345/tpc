<label id="upload-box">

type="file"
id="photo-upload"
multiple
accept="image/*"
hidden>

<div class="upload-copy">

+

<br><br>

drop photos here

<br>

or click to upload

</div>

</label>


<section id="gallery">

<!-- javascript fills this -->

</section>


<section id="complete">

</h2>

href="checkout.html"

</a>

</main>
