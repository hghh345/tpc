<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>checkout • tiny photo club</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<main class="checkout">

<a href="javascript:history.back()" class="back-button">← back</a>

<h1>

your first envelope.

</h1>

<p>

twelve tiny prints.

<br>

delivered every month.

</p>

<section class="plans">

<div class="plan" data-price="18">

<h2>
monthly
</h2>

<p>
12 photos
<br>
€18 / month
</p>

</div>


<div class="plan selected" data-price="45">

<h2>
three months
</h2>

<p>
12 photos / month
<br>
€45 / 3 months
</p>

<div class="save">
save €9
</div>

</div>

</section>


<!-- EMAIL -->

<div class="email-section">

<label for="email">
your email
</label>

<input
    type="email"
    id="email"
    name="email"
    placeholder="you@example.com"
    autocomplete="email"
    required
>

</div>


<!-- SUMMARY -->

<div class="summary">

selected plan

<span id="price">
€45
</span>

</div>


<button id="checkout-button" type="button">

continue to checkout →

</button>

</main>


<script src="checkout.js"></script>

</body>

</html>
