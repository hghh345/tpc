<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>pick your summer — tiny photo club</title>

    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            color: #000;
            background: #fff;
        }

        main {
            max-width: 700px;
            margin: 0 auto;
        }

        section {
            margin-bottom: 80px;
        }

        h1, h2, p {
            margin-top: 0;
        }

        h1 {
            font-size: 48px;
            line-height: 1;
        }

        h2 {
            font-size: 32px;
        }

        p {
            font-size: 18px;
            line-height: 1.4;
        }

        button {
            font: inherit;
            color: #000;
            background: #fff;
            border: 1px solid #000;
            cursor: pointer;
        }

        .plan {
            width: 100%;
            padding: 30px;
            text-align: left;
            margin-bottom: 20px;
        }

        .plan.selected {
            background: #000;
            color: #fff;
        }

        .email {
            width: 100%;
            box-sizing: border-box;
            padding: 18px;
            border: 1px solid #000;
            font-size: 18px;
        }

        .cta {
            padding: 18px 24px;
        }
    </style>
</head>

<body>

<main>


    <!-- INTRO -->

    <section class="section">

        <div class="copy">

            pick your summer.

        </div>

        <p>
            how many photos do you want
            to make real?
        </p>

    </section>


    <!-- 12 PHOTOS -->

    <section class="section">

        <button
            class="plan"
            type="button"
            data-pack="12"
            data-price="18">

            <h2>
                12 photos
            </h2>

            <p>
                the ones you really
                don't want to forget.
            </p>

            <strong>
                €18
            </strong>

        </button>

    </section>


    <!-- 36 PHOTOS -->

    <section class="section">

        <button
            class="plan"
            type="button"
            data-pack="36"
            data-price="36">

            <h2>
                36 photos
            </h2>

            <p>
                when narrowing it down
                feels impossible.
            </p>

            <strong>
                €36
            </strong>

        </button>

    </section>


    <!-- EMAIL -->

    <section class="section">

        <div class="copy">

            where should we send the details?

        </div>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="your email"
            autocomplete="email"
            required>

    </section>


    <!-- CONTINUE -->

    <section class="section">

        <button
            id="continue-button"
            class="cta"
            type="button">

            upload your photos →

        </button>

    </section>


</main>


<script>

const plans =
    document.querySelectorAll(".plan");

const emailInput =
    document.querySelector("#email");

const continueButton =
    document.querySelector("#continue-button");


let selectedPack = null;


/* -------------------------- */
/* PACK SELECTION */
/* -------------------------- */

plans.forEach(plan => {

    plan.addEventListener("click", () => {

        plans.forEach(p => {

            p.classList.remove("selected");

        });

        plan.classList.add("selected");

        selectedPack =
            plan.dataset.pack;

    });

});


/* -------------------------- */
/* CONTINUE */
/* -------------------------- */

continueButton.addEventListener(
    "click",
    () => {

        const email =
            emailInput.value.trim();


        if (
            !selectedPack ||
            !email ||
            !emailInput.checkValidity()
        ) {

            alert(
                "choose a pack and enter your email ♡"
            );

            return;

        }


        sessionStorage.setItem(
            "tpc_pack",
            selectedPack
        );


        sessionStorage.setItem(
            "tpc_email",
            email
        );


        window.location.href =
            "upload.html";

    }
);

</script>


</body>

</html>
