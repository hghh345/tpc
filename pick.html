<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>pick your summer — tiny photo club</title>

    <link rel="stylesheet" href="https://www.tinyphoto.club/style.css">

</head>


<body>

<main>


    <!-- INTRO -->

    <section class="section">

        <div class="copy">

            pick your summer.

        </div>

        <p>
            how many photos do you want
            to make real?
        </p>

    </section>


    <!-- 12 PHOTOS -->

    <section class="section">

        <button
            class="plan"
            type="button"
            data-pack="12"
            data-price="18">

            <h2>
                12 photos
            </h2>

            <p>
                the ones you really
                don't want to forget.
            </p>

            <strong>
                €18
            </strong>

        </button>

    </section>


    <!-- 36 PHOTOS -->

    <section class="section">

        <button
            class="plan"
            type="button"
            data-pack="36"
            data-price="36">

            <h2>
                36 photos
            </h2>

            <p>
                when narrowing it down
                feels impossible.
            </p>

            <strong>
                €36
            </strong>

        </button>

    </section>


    <!-- EMAIL -->

    <section class="section">

        <div class="copy">

            where should we send the details?

        </div>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="your email"
            autocomplete="email"
            required>

    </section>


    <!-- CONTINUE -->

    <section class="section">

        <button
            id="continue-button"
            class="cta"
            type="button">

            upload your photos →

        </button>

    </section>


</main>


<script>

const plans =
    document.querySelectorAll(".plan");

const emailInput =
    document.querySelector("#email");

const continueButton =
    document.querySelector("#continue-button");


let selectedPack = null;


/* -------------------------- */
/* PACK SELECTION */
/* -------------------------- */

plans.forEach(plan => {

    plan.addEventListener("click", () => {

        plans.forEach(p => {

            p.classList.remove("selected");

        });

        plan.classList.add("selected");

        selectedPack =
            plan.dataset.pack;

    });

});


/* -------------------------- */
/* CONTINUE */
/* -------------------------- */

continueButton.addEventListener(
    "click",
    () => {

        const email =
            emailInput.value.trim();


        if (
            !selectedPack ||
            !email ||
            !emailInput.checkValidity()
        ) {

            alert(
                "choose a pack and enter your email ♡"
            );

            return;

        }


        sessionStorage.setItem(
            "tpc_pack",
            selectedPack
        );


        sessionStorage.setItem(
            "tpc_email",
            email
        );


        window.location.href =
            "upload.html";

    }
);

</script>


</body>

</html>
